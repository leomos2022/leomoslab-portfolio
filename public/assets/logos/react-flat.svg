  </defs>
  <!-- Tres órbitas elípticas -->
  <ellipse cx="64" cy="64" rx="50" ry="16" fill="none" stroke="url(#react-cyan)" stroke-width="3" transform="rotate(-30 64 64)"/>
  <ellipse cx="64" cy="64" rx="50" ry="16" fill="none" stroke="url(#react-cyan)" stroke-width="3" transform="rotate(30 64 64)"/>
  <ellipse cx="64" cy="64" rx="50" ry="16" fill="none" stroke="url(#react-cyan)" stroke-width="3" transform="rotate(90 64 64)"/>
  <!-- Núcleo central -->
  <circle cx="64" cy="64" r="10" fill="url(#react-core)"/>
  <!-- Electrones en cada órbita -->
  <circle cx="114" cy="64" r="4.5" fill="#0B0F19"/>
  <circle cx="64" cy="14" r="4.5" fill="#0B0F19"/>
  <circle cx="86" cy="86" r="4.5" fill="#0B0F19"/>
  <circle cx="42" cy="42" r="4.5" fill="#0B0F19"/>
  <circle cx="86" cy="42" r="4.5" fill="#0B0F19"/>
  <circle cx="42" cy="86" r="4.5" fill="#0B0F19"/>
